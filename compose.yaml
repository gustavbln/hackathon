name: hackathon

services:
  web:
    build: .
    init: true
    command: sh -c "npm install && exec npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Linux deps and the Next cache stay in the container, off the slow host mount.
      - node_modules:/app/node_modules
      - next:/app/.next

volumes:
  node_modules:
  next:
